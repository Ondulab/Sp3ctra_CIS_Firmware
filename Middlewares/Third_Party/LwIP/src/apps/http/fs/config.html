<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Sp3ctra Configuration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="img/favicon_64x64.ico" type="image/x-icon">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            background-color: #333;
            color: #EEE;
            margin: 0;
            padding: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Pour Mozilla Firefox */
        input[type="number"] {
            -moz-appearance: textfield;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            min-width: 400px;
            margin: 0 auto;
            box-sizing: border-box;
            text-align: center;
        }

        .containerHead {
            margin: auto;
            text-align: center;
        }

        .title {
            color: #EEE;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
        }

        .container {
            width: 100%;
            border: 1px solid #666;
            padding: 10px;
            padding-top: 5px;
            padding-bottom: 5px;
            margin: 10px 0;
            border-radius: 8px;
            box-sizing: border-box;
        }

        select,
        input,
        button {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            background-color: #444;
            border: 2px solid #555;
            outline: none;
            margin: 5px 0;
            box-sizing: border-box;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            -moz-text-align-last: center;
            text-align-last: center;
        }

        input[disabled] {
            background-color: #222;
        }

        label {
            color: #EEE;
            font-weight: 500;
            background-color: transparent;
            margin: 5px 0;
            box-sizing: border-box;
            font-size: 16px;
            cursor: pointer;
        }


        select {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            background-color: #444;
            color: #999;
            border: 2px solid #444;
            border-radius: 0;
            outline: none;
            margin: 5px 0;
            box-sizing: border-box;
            font-size: 16px;
            cursor: pointer;
            text-align-last: center;
            backdrop-filter: none;
        }

        select:focus {
            color: #EEE;
        }

        .dpi-button,
        .hand-button {
            background-color: #444;
            color: #666;
            border: 2px solid #444;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .dpi-button.selected,
        .hand-button.selected {
            background-color: #999;
            border-color: #999;
        }

        button {
            color: #000;
            background-color: #666;
            border-color: #666;
            transition-duration: 0.2s;
        }

        button:hover {
            color: #EEE;
            background-color: #555;
            border-color: #777;
        }

        input[type="file"] {
            cursor: pointer;
        }

        input[type="number"] {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            background-color: #444;
            color: #AAA;
            border: 1px solid #444;
            outline: none;
            cursor: pointer;
            text-align: center;
            -moz-text-align-last: center;
            text-align-last: center;
        }

        input[type="number"]:focus {
            border-color: #AAA;
            color: #EEE;
        }

        .form-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group label {
            flex-basis: 25%;
            text-align: right;
        }

        .form-group input,
        .form-group button {
            flex-grow: 1;
            width: calc(60% / 4 - 10px);
            margin-left: 5px;
            margin-right: 5px;
        }

        .form-group select {
            flex-grow: 1;
            margin-left: 5px;
            margin-right: 5px;
        }

        .input-group {
            display: flex;
            justify-content: space-between;
        }

        .network-input-group input,
        .firmware-input-group input {
            flex-grow: 1;
            width: calc(60% / 4 - 10px);
            margin-left: 5px;
            margin-right: 5px;
            text-align: center;
        }

        .firmware-input-group input {
            text-align: left;
            text-align-last: left;
        }

        progress {
            width: 80%;
            height: 3px;
            color: #EEE;
            background-color: #444;
            border-radius: 0px;
            border: 2px solid #444;
            margin: 5px auto;
            margin-top: 0px;
            display: block;
            position: relative;
            overflow: hidden;
        }

        /* Chrome, Safari */
        progress::-webkit-progress-bar {
            background-color: #444;
        }

        progress::-webkit-progress-value {
            background-color: #EEE;
        }

        /* Pour Firefox */
        progress::-moz-progress-bar {
            background-color: #EEE;
        }

        input[type="file"] {
            background-color: #222;
            color: #AAA;
        }

        input[type="file"]::file-selector-button {
            background-color: #222;
            color: #222;
            border: none;
        }

        input[type="file"]::file-selector-text {
            color: #222;
        }

        .button-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .button-loading {
            background-color: #444;
            color: #444;
            pointer-events: none;
            display: inline-flex;
            justify-content: center;
            position: relative;
        }

        .button-loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 3px solid #EEE;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        .button-loading2 {
            background-color: #444;
            color: #444;
            pointer-events: none;
            display: inline-flex;
            justify-content: left;
            margin-left: 60px;
            position: absolute;
        }

        .button-loading2::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 3px solid #EEE;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        .select-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-grow: 1;
            width: calc(60% / 4 - 10px);
            position: relative;
        }

        @keyframes spin {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            /* Couleur de fond semi-transparente */
            z-index: 1000;
            /* Assurez-vous que l'overlay est au-dessus des autres contenus */
            display: none;
            /* Masqué par défaut */
        }

        .reconnect-notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #444;
            border: 2px solid #666;
            border-radius: 8px;
            padding: 30px;
            z-index: 1001;
            display: none;
            text-align: center;
            min-width: 300px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .reconnect-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .reconnect-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #666;
            border-top-color: #EEE;
            border-radius: 50%;
            animation: spin-reconnect 1s linear infinite;
            flex-shrink: 0;
        }

        .reconnect-message {
            color: #EEE;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.8;
            white-space: pre-line;
            text-align: center;
            width: 100%;
        }

        @keyframes spin-reconnect {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="main-wrapper">
        <div class="containerHead" style="align-self: stretch; width: 100%;">
            <img src="img/Sp3ctra.png" alt="Logo Image"
                style="width:256px; height:64px; display:block; margin-right:auto;">
        </div>

        <!-- CIS Parameters -->
        <div class="container">
            <span class="title">CIS PARAMETERS</span>
            <div class="form-group">
                <label for="dpi">DPI</label>
                <button id="dpi200" class="dpi-button" onclick="updateDPI('200')">200</button>
                <button id="dpi400" class="dpi-button" onclick="updateDPI('400')">400</button>
            </div>
            <div class="form-group">
                <label for="oversampling">OVSP</label>
                <div id="loadingIndicator" class="button-loading2" style="display:none;"></div>
                <div class="select-container" style="position: relative;">
                    <select id="oversampling" onchange="updateOversampling(this.value)">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="4">4</option>
                        <option value="8">8</option>
                        <option value="16">16</option>
                        <option value="32">32</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="freqValue">LPS</label>
                <input id="freqValue" disabled />
            </div>
            <div class="form-group">
                <label for="handedness">Hand</label>
                <button id="leftHand" class="hand-button" onclick="updateHand('0')">LEFT</button>
                <button id="rightHand" class="hand-button" onclick="updateHand('1')">RIGHT</button>
            </div>
            <div class="button-container">
                <button id="calibrateButton" onclick="startCalibration()">Start CIS Calibration</button>
            </div>
            <div style="text-align: center;">
                <p style="font-size: 12px; color: #666; margin: 5px 0;">
                    ⚠️ Move continuously over white reference surface
                </p>
            </div>
        </div>

        <!-- IMU Parameters -->
        <div class="container">
            <span class="title">IMU PARAMETERS</span>
            <div class="form-group">
                <label for="gyroSensitivity">Gyro</label>
                <div id="loadingIndicatorGyro" class="button-loading2" style="display:none;"></div>
                <div class="select-container" style="position: relative;">
                    <select id="gyroSensitivity" onchange="updateGyroSensitivity(this.value)">
                        <option value="0">±2000 dps</option>
                        <option value="1">±1000 dps</option>
                        <option value="2">±500 dps</option>
                        <option value="3">±250 dps</option>
                        <option value="4">±125 dps</option>
                        <option value="5">±62.5 dps</option>
                        <option value="6">±31.25 dps</option>
                        <option value="7">±15.625 dps</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="accelSensitivity">Accel</label>
                <div id="loadingIndicatorAccel" class="button-loading2" style="display:none;"></div>
                <div class="select-container" style="position: relative;">
                    <select id="accelSensitivity" onchange="updateAccelSensitivity(this.value)">
                        <option value="0">±16 g</option>
                        <option value="1">±8 g</option>
                        <option value="2">±4 g</option>
                        <option value="3">±2 g</option>
                    </select>
                </div>
            </div>
            <div class="button-container">
                <button id="calibrateIMUButton" onclick="startIMUCalibration()">Start IMU Calibration</button>
            </div>
            <div style="text-align: center;">
                <p style="font-size: 12px; color: #666; margin: 5px 0;">
                    ⚠️ Keep device stationary during calibration (~1.5s)
                </p>
            </div>
        </div>

        <!-- GUI & Screensaver Parameters -->
        <div class="container">
            <span class="title">GUI & SCREENSAVER SETTINGS</span>
            <div class="form-group">
                <label for="guiShowImu">Show IMU</label>
                <button id="guiShowImuOff" class="hand-button" onclick="updateGuiShowImu('0')">OFF</button>
                <button id="guiShowImuOn" class="hand-button" onclick="updateGuiShowImu('1')">ON</button>
            </div>
            <div class="form-group">
                <label for="guiInvertCisImage">Invert CIS Image</label>
                <button id="guiInvertOff" class="hand-button" onclick="updateGuiInvertCisImage('0')">OFF</button>
                <button id="guiInvertOn" class="hand-button" onclick="updateGuiInvertCisImage('1')">ON</button>
            </div>
            <div class="form-group">
                <label for="screensaverTimeout">Timeout (sec)</label>
                <div id="loadingIndicatorScreensaver" class="button-loading2" style="display:none;"></div>
                <input type="number" id="screensaverTimeout" min="1" max="1000"
                    onchange="updateScreensaverTimeout(this.value)">
            </div>
            <div class="form-group">
                <label for="motionThresholdAcc">Motion Acc (g)</label>
                <div id="loadingIndicatorMotionAcc" class="button-loading2" style="display:none;"></div>
                <input type="number" id="motionThresholdAcc" min="0.01" max="1.0" step="0.01"
                    onchange="updateMotionThresholdAcc(this.value)">
            </div>
            <div class="form-group">
                <label for="motionThresholdGyro">Motion Gyro (dps)</label>
                <div id="loadingIndicatorMotionGyro" class="button-loading2" style="display:none;"></div>
                <input type="number" id="motionThresholdGyro" min="0.5" max="10.0" step="0.5"
                    onchange="updateMotionThresholdGyro(this.value)">
            </div>
        </div>

        <!-- Network Configuration -->
        <div class="container">
            <span class="title">NETWORK SETTINGS</span>
            <div class="form-group network-input-group">
                <label>IP Addr</label>
                <input type="number" id="ipPart1" min="0" max="255">
                <input type="number" id="ipPart2" min="0" max="255">
                <input type="number" id="ipPart3" min="0" max="255">
                <input type="number" id="ipPart4" min="0" max="255">
            </div>
            <div class="form-group network-input-group">
                <label>Subnet Mask</label>
                <input type="number" id="maskPart1" min="0" max="255">
                <input type="number" id="maskPart2" min="0" max="255">
                <input type="number" id="maskPart3" min="0" max="255">
                <input type="number" id="maskPart4" min="0" max="255">
            </div>
            <div class="form-group network-input-group">
                <label>Gateway</label>
                <input type="number" id="gateway1" min="0" max="255">
                <input type="number" id="gateway2" min="0" max="255">
                <input type="number" id="gateway3" min="0" max="255">
                <input type="number" id="gateway4" min="0" max="255">
            </div>
            <div class="form-group network-input-group">
                <label>Dest IP Addr</label>
                <input type="number" id="ipDestPart1" min="0" max="255">
                <input type="number" id="ipDestPart2" min="0" max="255">
                <input type="number" id="ipDestPart3" min="0" max="255">
                <input type="number" id="ipDestPart4" min="0" max="255">
            </div>
            <div class="form-group">
                <label for="udp_port">CIS UDP Port</label>
                <input type="number" id="udp_port" name="udp_port" value="%udp_port%" min="1" max="65535" required>
            </div>

            <div class="form-group">
                <label for="midiControlPort">MIDI Control Port</label>
                <input type="number" id="midiControlPort" min="0" max="65535" onchange="updateMidiDataPortDisplay()">
            </div>
            <div class="form-group">
                <label for="midiDataPort">MIDI Data Port</label>
                <input type="number" id="midiDataPort" disabled />
            </div>
            <div class="button-container">
                <button id="updateNetworkBtn" onclick="updateNetworkConfig()">Apply Network Settings</button>
            </div>
        </div>

        <!-- Firmware Update -->
        <div class="container">
            <form id="firmwareForm" action="/upload" method="post" enctype="multipart/form-data">
                <span class="title">FIRMWARE UPDATE</span>
                <div class="form-group firmware-input-group">
                    <label for="firmwareFile">Select Firmware</label>
                    <input type="file" id="firmwareFile" name="firmware" accept=".bin">
                </div>
                <div class="form-group">
                    <progress id="uploadProgress" value="0" max="100"></progress>
                </div>
                <div class="button-container">
                    <button type="submit">Upload Firmware</button>
                </div>
            </form>
        </div>

        <!-- Advanced Settings -->
        <div class="container">
            <span class="title">ADVANCED SETTINGS</span>
            <div class="button-container">
                <button id="factoryResetBtn" onclick="factoryReset()">Factory Reset</button>
            </div>
        </div>

        <!-- Firmware Version Footer -->
        <p id="firmwareVersion" style="font-size: 12px; color: red; margin: 15px 0 5px 0; text-align: center;">
            Firmware Version: <span id="versionNumber">Loading...</span>
        </p>

        <div id="overlay" class="overlay"></div>
        <div id="reconnectNotification" class="reconnect-notification">
            <div class="reconnect-content">
                <div class="reconnect-spinner"></div>
                <div id="reconnectMessage" class="reconnect-message"></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/crc-32/crc32.min.js"></script>
    <script>
        var overlay = document.getElementById('overlay');

        function initialize() {
            overlay.style.display = 'none'; // Remove overlay
            setupInputListeners().then(() => {
                console.log("Input listeners setup completed.");
                return loadFirmwareVersion();
            })
                .then(() => loadDPI())
                .then(() => loadHand())
                .then(() => loadOversampling())
                .then(() => loadGuiShowImu())
                .then(() => loadGuiInvertCisImage())
                .then(() => loadScreensaverTimeout())
                .then(() => loadMotionThresholdAcc())
                .then(() => loadMotionThresholdGyro())
                .then(() => loadGyroSensitivity())
                .then(() => loadAccelSensitivity())
                .then(() => loadNetworkConfig())
                .then(() => timer())
                .catch(error => {
                    console.error("Initialization failed:", error);
                });
        }

        function setupInputListeners() {
            return new Promise(resolve => {
                var ipInputs = document.querySelectorAll('input[type="number"]');
                ipInputs.forEach(function (input) {
                    // Handle European decimal separator (comma) by replacing with dot
                    input.addEventListener('keypress', function (e) {
                        if (e.key === ',') {
                            e.preventDefault();
                            const cursorPos = this.selectionStart;
                            const currentValue = this.value;
                            // Insert a dot at cursor position
                            this.value = currentValue.slice(0, cursorPos) + '.' + currentValue.slice(cursorPos);
                            // Move cursor after the inserted dot
                            this.setSelectionRange(cursorPos + 1, cursorPos + 1);
                        }
                    });

                    // Validation and bounds correction when leaving the field
                    input.addEventListener('blur', function () {
                        if (this.value === "" || this.value === "." || this.value === "-" || this.value === "-.") {
                            this.value = this.min; // Default to min if empty or invalid
                            return;
                        }

                        const isFloat = this.step && parseFloat(this.step) !== parseInt(this.step);
                        let num = isFloat ? parseFloat(this.value) : parseInt(this.value, 10);

                        if (isNaN(num)) {
                            this.value = this.min;
                        } else if (num > parseFloat(this.max)) {
                            this.value = this.max;
                        } else if (num < parseFloat(this.min)) {
                            this.value = this.min;
                        }
                    });
                });
                resolve();
            });
        }

        var timerId;  // Déclaration au niveau global ou dans une portée accessible

        function timer() {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    document.getElementById("freqValue").value = this.responseText;
                }
            };
            xhr.open("GET", "getFreq?_=" + new Date().getTime(), true);
            xhr.send();
            timerId = setTimeout(timer, 1000);  // Stockage de l'identifiant de timeout
        }

        function stopTimers() {
            clearTimeout(timerId);  // Assuming you keep a reference to your timeout
        }

        // Show/hide reconnection notification
        function showReconnectNotification(message) {
            var notification = document.getElementById('reconnectNotification');
            var messageElement = document.getElementById('reconnectMessage');
            messageElement.textContent = message;
            notification.style.display = 'block';
        }

        function hideReconnectNotification() {
            var notification = document.getElementById('reconnectNotification');
            notification.style.display = 'none';
        }

        function updateReconnectMessage(message) {
            var messageElement = document.getElementById('reconnectMessage');
            messageElement.textContent = message;
        }

        function setDPI(value) {
            var buttons = document.querySelectorAll('.dpi-button');
            buttons.forEach(function (button) {
                button.classList.remove('selected');
                if (button.textContent.trim() === value) {
                    button.classList.add('selected');
                }
            });
        }

        // Load DPI Settings
        function loadDPI() {
            return new Promise((resolve, reject) => {
                var xhr = new XMLHttpRequest();
                xhr.open("GET", "getDPI", true);
                xhr.onload = function () {
                    if (xhr.status === 200) {
                        console.log("DPI settings loaded:", xhr.responseText);
                        setDPI(xhr.responseText.trim());
                        resolve();
                    } else {
                        console.error("Failed to load DPI settings:", xhr.statusText);
                        reject(new Error("Failed to load DPI settings with status: " + xhr.status));
                    }
                };
                xhr.onerror = () => reject(new Error("Network request failed"));
                xhr.send();
            });
        }

        // Update DPI Settings
        function updateDPI(newDPI) {
            return new Promise((resolve, reject) => {
                var dpi200Button = document.getElementById('dpi200');
                var dpi400Button = document.getElementById('dpi400');
                dpi200Button.classList.add('button-loading');  // Add loading class
                dpi400Button.classList.add('button-loading');  // Add loading class
                if (!newDPI || isNaN(newDPI)) {
                    alert("Invalid DPI value. Please enter a numeric value.");
                    dpi200Button.classList.remove('button-loading');
                    dpi400Button.classList.remove('button-loading');
                    reject(new Error("Invalid DPI value"));
                    return;
                }
                var xhr = new XMLHttpRequest();
                xhr.open("POST", "setDPI", true);
                xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
                xhr.onload = function () {
                    if (xhr.status === 200) {
                        console.log("DPI updated to", newDPI);

                        // Device will reboot, stop timers and show overlay
                        stopTimers();
                        overlay.style.display = 'block';

                        // Show non-modal notification immediately (non-blocking)
                        showReconnectNotification("Applying DPI settings\nDevice rebooting\nWaiting for reconnection...");

                        // Wait for device to become available again, then reload
                        waitForDeviceAndReload(newDPI);

                        resolve();
                    } else {
                        console.error("Failed to update DPI settings:", xhr.statusText);
                        dpi200Button.classList.remove('button-loading');  // Remove loading class on error
                        dpi400Button.classList.remove('button-loading');  // Remove loading class on error
                        overlay.style.display = 'none'; // Remove overlay
                        reject(new Error("Failed to update DPI settings with status: " + xhr.status));
                    }
                };
                xhr.onerror = () => {
                    dpi200Button.classList.remove('button-loading');  // Remove loading class on network error

        // Wait for device to be available again after reboot, then reload page
        function waitForDeviceAndReload(expectedDPI) {
            var startTime = Date.now();
            var maxWaitTime = 30000; // Maximum 30 seconds
            var initialDelay = 5000; // Wait 5 seconds before first check (device is rebooting)
            var consecutiveSuccessfulReads = 0;
            var requiredSuccessfulReads = 3; // Require 3 consecutive successful reads with correct DPI

            setTimeout(function checkDevice() {
                // Check if we've exceeded max wait time
                if (Date.now() - startTime > maxWaitTime) {
                    console.log("Timeout waiting for device, reloading anyway...");
                    window.location.href = window.location.pathname + '?nocache=' + new Date().getTime();
                    return;
                }

                // Try to reach the device
                var xhr = new XMLHttpRequest();
                xhr.timeout = 2000; // 2 second timeout per attempt
                xhr.open("GET", "/getDPI?nocache=" + new Date().getTime(), true);

                xhr.onload = function () {
                    if (xhr.status === 200) {
                        var currentDPI = xhr.responseText.trim();
                        console.log("Device responded with DPI:", currentDPI);

                        // Check if DPI matches expected value
                        if (currentDPI === expectedDPI) {
                            consecutiveSuccessfulReads++;
                            console.log("DPI matches expected value (" + consecutiveSuccessfulReads + "/" + requiredSuccessfulReads + ")");

                            if (consecutiveSuccessfulReads >= requiredSuccessfulReads) {
                                console.log("Device ready with correct DPI confirmed, reloading page...");
                                // Reload the page to ensure UI is in sync with device state
                                window.location.href = window.location.pathname + '?nocache=' + new Date().getTime();
                            } else {
                                // Need more confirmations
                                setTimeout(checkDevice, 500);
                            }
                        } else {
                            console.log("DPI not yet updated (got " + currentDPI + ", expected " + expectedDPI + "), retrying in 1s...");
                            consecutiveSuccessfulReads = 0; // Reset counter
                            setTimeout(checkDevice, 1000);
                        }
                    } else {
                        // Device responded but with error, retry
                        console.log("Device not ready yet (status: " + xhr.status + "), retrying in 1s...");
                        consecutiveSuccessfulReads = 0; // Reset counter
                        setTimeout(checkDevice, 1000);
                    }
                };

                xhr.onerror = function () {
                    // Device not reachable yet, retry
                    console.log("Device not reachable yet, retrying in 1s...");
                    consecutiveSuccessfulReads = 0; // Reset counter
                    setTimeout(checkDevice, 1000);
                };

                xhr.ontimeout = function () {
                    // Request timed out, retry
                    console.log("Request timeout, retrying in 1s...");
                    consecutiveSuccessfulReads = 0; // Reset counter
                    setTimeout(checkDevice, 1000);
                };

                xhr.send();
            }, initialDelay);
        }

        // Wait for device to be available at new IP address after network change, then reload page
        function waitForNetworkChangeAndReload(newIP) {
            var startTime = Date.now();
            var maxWaitTime = 45000; // Maximum 45 seconds (longer for network change)
            var initialDelay = 10000; // Wait 10 seconds before first check (device is rebooting and reconfiguring network)
            var consecutiveSuccessfulReads = 0;
            var requiredSuccessfulReads = 3; // Require 3 consecutive successful reads

            setTimeout(function checkDevice() {
                // Check if we've exceeded max wait time
                if (Date.now() - startTime > maxWaitTime) {
                    console.log("Timeout waiting for device at new IP, redirecting anyway...");
                    window.location.href = 'http://' + newIP + '/config.html?nocache=' + new Date().getTime();
                    return;
                }

                // Try to reach the device at new IP
                var xhr = new XMLHttpRequest();
                xhr.timeout = 3000; // 3 second timeout per attempt
                xhr.open("GET", "http://" + newIP + "/getFirmwareVersion?nocache=" + new Date().getTime(), true);

                xhr.onload = function () {
                    if (xhr.status === 200) {
                        consecutiveSuccessfulReads++;
                        console.log("Device responded at new IP (" + consecutiveSuccessfulReads + "/" + requiredSuccessfulReads + ")");

                        if (consecutiveSuccessfulReads >= requiredSuccessfulReads) {
                            console.log("Device ready at new IP confirmed, reloading page...");
                            // Reload the page at new IP
                            window.location.href = 'http://' + newIP + '/config.html?nocache=' + new Date().getTime();
                        } else {
                            // Need more confirmations
                            setTimeout(checkDevice, 1000);
                        }
                    } else {
                        // Device responded but with error, retry
                        console.log("Device not ready yet at new IP (status: " + xhr.status + "), retrying in 2s...");
                        consecutiveSuccessfulReads = 0; // Reset counter
                        setTimeout(checkDevice, 2000);
                    }
                };

                xhr.onerror = function () {
                    // Device not reachable yet at new IP, retry
                    console.log("Device not reachable yet at new IP, retrying in 2s...");
                    consecutiveSuccessfulReads = 0; // Reset counter
                    setTimeout(checkDevice, 2000);
                };

                xhr.ontimeout = function () {
                    // Request timed out, retry
                    console.log("Request timeout for new IP, retrying in 2s...");
                    consecutiveSuccessfulReads = 0; // Reset counter
                    setTimeout(checkDevice, 2000);
                };

                xhr.send();
            }, initialDelay);
        }

                    if (xhr.status === 200) {
                        console.log("IMU Calibration completed successfully");
                        alert("✓ IMU Calibration Successful!\n\nCalibration data has been saved to flash memory.");
                        resolve();
                    } else if (xhr.status === 408) {
                        console.error("IMU Calibration timeout");
                        alert("✗ IMU Calibration Timeout!\n\nPlease ensure the device is completely stationary during calibration.");
                        reject(new Error("Timeout"));
                    } else {
                        console.error("IMU Calibration failed:", xhr.statusText);

                    if (xhr.status === 200) {
                        document.getElementById('motionThresholdGyro').value = xhr.responseText.trim();
                        console.log("Motion Threshold Gyro loaded:", xhr.responseText);
                        resolve();
                    } else {
                        console.error("Failed to load Motion Threshold Gyro:", xhr.statusText);
                        reject(new Error("Failed to load Motion Threshold Gyro"));
                    }
                };
                xhr.onerror = () => {
                    loadingIndicator.style.display = 'none';
                    reject(new Error("Network request failed"));
                };
                xhr.send();
            });
        }

        function updateMotionThresholdGyro(newValue) {
            const loadingIndicator = document.getElementById('loadingIndicatorMotionGyro');
            loadingIndicator.style.display = 'inline-flex';
            return new Promise((resolve, reject) => {
                var xhr = new XMLHttpRequest();
                xhr.open("POST", "/setMotionThresholdGyro", true);
                xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
                xhr.onload = function () {
                    loadingIndicator.style.display = 'none';
                    if (xhr.status === 200) {
                        console.log("Motion Threshold Gyro updated to:", newValue);
                        resolve();
                    } else {
                        console.error("Failed to update Motion Threshold Gyro:", xhr.statusText);
                        reject(new Error("Failed to update Motion Threshold Gyro"));
                    }
                };
                xhr.onerror = () => {
                    loadingIndicator.style.display = 'none';
                    reject(new Error("Network request failed"));
                };
                xhr.send("motion_threshold_gyro=" + newValue);
            });
        }

        // Load Firmware Version
        function loadFirmwareVersion() {
            return new Promise((resolve, reject) => {
                var xhr = new XMLHttpRequest();
                xhr.open("GET", "/getFirmwareVersion", true);
                xhr.onload = function () {
                    if (xhr.status === 200) {
                        document.getElementById('versionNumber').textContent = xhr.responseText.trim();
                        console.log("Firmware version loaded:", xhr.responseText);
                        resolve();
                    } else {
                        console.error("Failed to load firmware version:", xhr.statusText);
                        document.getElementById('versionNumber').textContent = "Unknown";
                        reject(new Error("Failed to load firmware version"));
                    }
                };
                xhr.onerror = () => {
                    document.getElementById('versionNumber').textContent = "Unknown";
                    reject(new Error("Network request failed"));
                };
                xhr.send();
            });
        }

        function loadNetworkConfig() {
            return new Promise((resolve, reject) => {
                var xhr = new XMLHttpRequest();
                xhr.open("GET", "/getNetworkConfig", true);
                xhr.onload = function () {
                    if (xhr.status === 200) {
                        var config = JSON.parse(xhr.responseText);
                        document.getElementById("ipPart1").value = config.ip.split('.')[0];
                        document.getElementById("ipPart2").value = config.ip.split('.')[1];
                        document.getElementById("ipPart3").value = config.ip.split('.')[2];
                        document.getElementById("ipPart4").value = config.ip.split('.')[3];
                        document.getElementById("maskPart1").value = config.mask.split('.')[0];
                        document.getElementById("maskPart2").value = config.mask.split('.')[1];
                        document.getElementById("maskPart3").value = config.mask.split('.')[2];
                        document.getElementById("maskPart4").value = config.mask.split('.')[3];
                        document.getElementById("gateway1").value = config.gw.split('.')[0];
                        document.getElementById("gateway2").value = config.gw.split('.')[1];
                        document.getElementById("gateway3").value = config.gw.split('.')[2];
                        document.getElementById("gateway4").value = config.gw.split('.')[3];
                        document.getElementById("ipDestPart1").value = config.dest_ip.split('.')[0];
                        document.getElementById("ipDestPart2").value = config.dest_ip.split('.')[1];
                        document.getElementById("ipDestPart3").value = config.dest_ip.split('.')[2];
                        document.getElementById("ipDestPart4").value = config.dest_ip.split('.')[3];
                        document.getElementById("udp_port").value = config.udp_port;

                        // RTP-MIDI ports
                        if (config.rtpmidi_control_port !== undefined) {
                            document.getElementById("midiControlPort").value = config.rtpmidi_control_port;
                        }
                        updateMidiDataPortDisplay();
                        resolve();
                    } else {
                        console.error("Failed to load network settings:", xhr.statusText);
                        reject(new Error("Network configuration failed to load with status: " + xhr.status));
                    }
                };
                xhr.onerror = () => reject(new Error("Network request failed"));
                xhr.send();
            });
        }

        function updateMidiDataPortDisplay() {
            var controlPort = parseInt(document.getElementById("midiControlPort").value, 10);
            if (isNaN(controlPort)) {
                document.getElementById("midiDataPort").value = "";
                return;
            }
            var dataPort = controlPort + 1;
            if (dataPort > 65535) {
                dataPort = 65535;
            }
            document.getElementById("midiDataPort").value = dataPort;
        }

        function updateNetworkConfig() {
            return new Promise((resolve, reject) => {
                // Selecting the button associated with the network configuration update action.
                var updateNetworkButton = document.getElementById('updateNetworkBtn');
                updateNetworkButton.classList.add('button-loading');  // Add loading class to the button to indicate processing.

                // Collect network configuration data from input fields
                const ipAddr = [
                    document.getElementById("ipPart1").value,
                    document.getElementById("ipPart2").value,
                    document.getElementById("ipPart3").value,
                    document.getElementById("ipPart4").value
                ].join('.');

                const subnetMask = [
                    document.getElementById("maskPart1").value,
                    document.getElementById("maskPart2").value,
                    document.getElementById("maskPart3").value,
                    document.getElementById("maskPart4").value
                ].join('.');

                const gateway = [
                    document.getElementById("gateway1").value,
                    document.getElementById("gateway2").value,
                    document.getElementById("gateway3").value,
                    document.getElementById("gateway4").value
                ].join('.');

                const destIpAddr = [
                    document.getElementById("ipDestPart1").value,
                    document.getElementById("ipDestPart2").value,
                    document.getElementById("ipDestPart3").value,
                    document.getElementById("ipDestPart4").value
                ].join('.');

                const udpPort = document.getElementById("udp_port").value;

                const rtpmidiControlPort = document.getElementById("midiControlPort").value;

                // Construct the POST request data
                const data = `ip=${ipAddr}&mask=${subnetMask}&gateway=${gateway}&dest_ip=${destIpAddr}&udp_port=${udpPort}&rtpmidi_control_port=${rtpmidiControlPort}`;

                // Create and send the HTTP POST request
                var xhr = new XMLHttpRequest();
                xhr.open("POST", "/updateNetworkConfig", true);
                xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
                xhr.onload = function () {
                    if (xhr.status === 200) {
                        console.log("Network configuration updated successfully.");

                        // Device will reboot, stop timers and show overlay
                        stopTimers();
                        overlay.style.display = 'block';

                        // Show non-modal notification immediately (non-blocking)
                        showReconnectNotification("Applying network settings\nDevice rebooting\n\n⚠️ Important: Depending on your configuration,\nyou may need to reconfigure your network connection.\n\nConnecting to new IP address...");

                        // Wait for device to become available at new IP, then reload
                        waitForNetworkChangeAndReload(ipAddr);

                        resolve();
                    } else {
                        console.error("Failed to update network configuration:", xhr.statusText);
                        updateNetworkButton.classList.remove('button-loading');  // Remove loading class on error.
                        overlay.style.display = 'none'; // Remove overlay
                        reject(new Error("Failed to update network configuration with status: " + xhr.status));
                    }
                };

                xhr.onerror = function () {
                    console.error("Network request failed.");
                    updateNetworkButton.classList.remove('button-loading');  // Remove loading class on network error.
                    overlay.style.display = 'none'; // Remove overlay
                    alert("✗ Network Error!\n\nUnable to communicate with device.");
                    reject(new Error("Network request error"));
                };

                xhr.send(data);
            });
        }

        document.getElementById('firmwareForm').addEventListener('submit', function (e) {
            e.preventDefault();  // Prevent the default form submission

            var formData = new FormData(this);
            var xhr = new XMLHttpRequest();
            var submitButton = document.querySelector('#firmwareForm button[type="submit"]');  // Assuming there is one submit button within this form
            submitButton.classList.add('button-loading');  // Add loading class to the button to show processing

            // Configure the request
            xhr.open('POST', this.action, true);

            // Listen to the progress event
            xhr.upload.onprogress = function (e) {
                if (e.lengthComputable) {
                    var percentComplete = (e.loaded / e.total) * 100;
                    document.getElementById('uploadProgress').value = percentComplete;
                }
            };

            // Listen to the load event
            xhr.onload = function () {
                submitButton.classList.remove('button-loading');  // Remove loading class upon completion
                if (xhr.status === 200) {
                    alert("✓ Firmware Upload Successful!\n\nFirmware has been transferred to device.");
                    document.getElementById('uploadProgress').value = 0;
                } else {
                    alert('Error during firmware updade: ' + xhr.status);
                }
            };

            // Handle network errors
            xhr.onerror = function () {
                submitButton.classList.remove('button-loading');  // Remove loading class on network error
                alert("✗ Network Error!\n\nUnable to communicate with device.");
            };

            // Send the form data
            xhr.send(formData);
        });

        // Wait for device to be available at default IP after factory reset, then reload page
        function waitForFactoryResetAndReload(defaultIP) {
            var startTime = Date.now();
            var maxWaitTime = 45000; // Maximum 45 seconds
            var initialDelay = 10000; // Wait 10 seconds before first check (device is rebooting and resetting)
            var consecutiveSuccessfulReads = 0;
            var requiredSuccessfulReads = 3; // Require 3 consecutive successful reads

            setTimeout(function checkDevice() {
                // Check if we've exceeded max wait time
                if (Date.now() - startTime > maxWaitTime) {
                    console.log("Timeout waiting for device at default IP, redirecting anyway...");
                    window.location.href = 'http://' + defaultIP + '/config.html?nocache=' + new Date().getTime();
                    return;
                }

                // Try to reach the device at default IP
                var xhr = new XMLHttpRequest();
                xhr.timeout = 3000; // 3 second timeout per attempt
                xhr.open("GET", "http://" + defaultIP + "/getFirmwareVersion?nocache=" + new Date().getTime(), true);

                xhr.onload = function () {
                    if (xhr.status === 200) {
                        consecutiveSuccessfulReads++;
                        console.log("Device responded at default IP (" + consecutiveSuccessfulReads + "/" + requiredSuccessfulReads + ")");

                        if (consecutiveSuccessfulReads >= requiredSuccessfulReads) {
                            console.log("Device ready at default IP confirmed, reloading page...");
                            // Reload the page at default IP
                            window.location.href = 'http://' + defaultIP + '/config.html?nocache=' + new Date().getTime();
                        } else {
                            // Need more confirmations
                            setTimeout(checkDevice, 1000);
                        }
                    } else {
                        // Device responded but with error, retry
                        console.log("Device not ready yet at default IP (status: " + xhr.status + "), retrying in 2s...");
                        consecutiveSuccessfulReads = 0; // Reset counter
                        setTimeout(checkDevice, 2000);
                    }
                };

                xhr.onerror = function () {
                    // Device not reachable yet at default IP, retry
                    console.log("Device not reachable yet at default IP, retrying in 2s...");
                    consecutiveSuccessfulReads = 0; // Reset counter
                    setTimeout(checkDevice, 2000);
                };

                xhr.ontimeout = function () {
                    // Request timed out, retry
                    console.log("Request timeout for default IP, retrying in 2s...");
                    consecutiveSuccessfulReads = 0; // Reset counter
                    setTimeout(checkDevice, 2000);
                };

                xhr.send();
            }, initialDelay);
        }

        function factoryReset() {
            return new Promise((resolve, reject) => {
                // Selecting the button associated with the factory reset action.
                var resetButton = document.getElementById('factoryResetBtn');
                resetButton.classList.add('button-loading');  // Add loading class to indicate processing.

                var xhr = new XMLHttpRequest();
                xhr.open("POST", "factoryReset", true);
                xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
                xhr.onload = function () {
                    if (xhr.status === 200) {
                        console.log("Factory reset initiated");

                        // Device will reboot, stop timers and show overlay
                        stopTimers();
                        overlay.style.display = 'block';

                        // Show non-modal notification immediately (non-blocking)
                        showReconnectNotification(
                            "Factory reset in progress\n" +
                            "Device rebooting\n\n" +
                            "⚠️ Important: Device will reset to default IP\n" +
                            "Default IP: 192.168.100.1\n\n" +
                            "Waiting for reconnection..."
                        );

                        // Wait for device to become available at default IP (192.168.1.10)
                        waitForFactoryResetAndReload('192.168.100.1');

                        resolve();
                    } else {
                        console.error("Failed to reset factory settings:", xhr.statusText);
                        resetButton.classList.remove('button-loading');  // Remove loading class on error.
                        reject(new Error("Failed to reset factory settings with status: " + xhr.status));
                    }
                };
                xhr.onerror = function () {
                    console.error("Network request failed.");
                    resetButton.classList.remove('button-loading');  // Remove loading class on network error.
                    alert("✗ Network Error!\n\nUnable to communicate with device.");
                    reject(new Error("Network request error"));
                };
                xhr.send("START_FACTORY_RESET");
            });
        }

        document.addEventListener('DOMContentLoaded', initialize);
    </script>
