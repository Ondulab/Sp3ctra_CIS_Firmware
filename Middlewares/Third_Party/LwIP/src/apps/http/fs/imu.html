<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Sp3ctra Live IMU</title>
    <link rel="icon" href="img/favicon_64x64.ico" type="image/x-icon">
    <link rel="stylesheet" href="sp3ctra.css">
</head>

<body data-page="imu">
    <div class="main-wrapper wide">
        <div class="container">
            <span class="title">LIVE IMU</span>

            <div class="frame">
                <canvas id="acc" height="180"></canvas>
                <span class="caption">ACCELEROMETER</span>
                <span class="readout" id="accRead"></span>
            </div>
            <div class="statusbar">
                <span class="axis" style="color:#00d9ff;">X <b id="ax">0.00</b></span>
                <span class="axis" style="color:#ff2ed0;">Y <b id="ay">0.00</b></span>
                <span class="axis" style="color:#ffb020;">Z <b id="az">0.00</b></span> g
            </div>

            <div class="frame" style="margin-top:10px;">
                <canvas id="gyr" height="180"></canvas>
                <span class="caption">GYROSCOPE</span>
                <span class="readout" id="gyrRead"></span>
            </div>
            <div class="statusbar">
                <span class="axis" style="color:#00d9ff;">X <b id="gx">0.0</b></span>
                <span class="axis" style="color:#ff2ed0;">Y <b id="gy">0.0</b></span>
                <span class="axis" style="color:#ffb020;">Z <b id="gz">0.0</b></span> dps
            </div>

            <div class="statusbar">
                <span class="leds">
                    <span class="led" id="btn0">1</span>
                    <span class="led" id="btn1">2</span>
                    <span class="led" id="btn2">3</span>
                </span>
                <span id="status">connecting&hellip;</span>
            </div>

            <div class="boxrow">
                <div class="box narrow">
                    <span class="boxlabel">STREAM</span>
                    <button id="run" class="selected">Pause</button>
                </div>
                <div class="box">
                    <span class="boxlabel">RATE</span>
                    <select id="fps">
                        <option value="10">10 /s</option>
                        <option value="20" selected>20 /s</option>
                        <option value="40">40 /s</option>
                    </select>
                </div>
            </div>

            <div class="section">&mdash; IMU &mdash;</div>

            <div class="boxrow">
                <div class="box">
                    <span class="boxlabel">GYRO RANGE</span>
                    <div id="loadingIndicatorGyro" class="button-loading2" style="display:none;"></div>
                    <select id="gyroSensitivity" onchange="updateGyroSensitivity(this.value)">
                        <option value="0">&plusmn;2000 dps</option>
                        <option value="1">&plusmn;1000 dps</option>
                        <option value="2">&plusmn;500 dps</option>
                        <option value="3">&plusmn;250 dps</option>
                        <option value="4">&plusmn;125 dps</option>
                        <option value="5">&plusmn;62.5 dps</option>
                        <option value="6">&plusmn;31.25 dps</option>
                        <option value="7">&plusmn;15.625 dps</option>
                    </select>
                </div>
                <div class="box">
                    <span class="boxlabel">ACCEL RANGE</span>
                    <div id="loadingIndicatorAccel" class="button-loading2" style="display:none;"></div>
                    <select id="accelSensitivity" onchange="updateAccelSensitivity(this.value)">
                        <option value="0">&plusmn;16 g</option>
                        <option value="1">&plusmn;8 g</option>
                        <option value="2">&plusmn;4 g</option>
                        <option value="3">&plusmn;2 g</option>
                    </select>
                </div>
                <div class="box">
                    <span class="boxlabel">CALIBRATION</span>
                    <button id="calibrateIMUButton" onclick="startIMUCalibration()">Start</button>
                </div>
            </div>
            <p class="hint">&#9888;&#65039; Calibration: keep the device still (~1.5 s)</p>
        </div>
    </div>
    <script src="sp3ctra.js"></script>
    <script>
        var COLS = ['#00d9ff', '#ff2ed0', '#ffb020'];   /* X, Y, Z */
        /* Full scales, indexed by the device's sensitivity setting (see the
         * IMU PARAMETERS selects): the charts read what the sensor is set to. */
        var ACC_FS = [16, 8, 4, 2];
        var GYR_FS = [2000, 1000, 500, 250, 125, 62.5, 31.25, 15.625];
        var statusEl = document.getElementById('status');
        var running = true, errors = 0, samples = 0, rate = 0, lastRateTick = 0, lastSeq = -1;

        /* Each chart plots into an offscreen strip of SPAN samples and is blitted
         * to its frame; only the part already sampled is shown, so the frame is
         * full from the first sample instead of creeping in from the right. */
        var SPAN = 400;

        function chart(id) {
            var c = document.getElementById(id);
            var oc = document.createElement('canvas');
            return {
                c: c, ctx: c.getContext('2d'), oc: oc, octx: oc.getContext('2d'),
                prev: [null, null, null],   /* last y per axis: the trace continues */
                filled: 0
            };
        }

        var CH = { acc: chart('acc'), gyro: chart('gyr') };

        function clearChart(ch) {
            ch.oc.width = SPAN;
            ch.oc.height = ch.c.height;
            ch.octx.fillStyle = '#20202a';
            ch.octx.fillRect(0, 0, SPAN, ch.oc.height);
            ch.octx.strokeStyle = '#3a3a3a';
            ch.octx.beginPath();
            ch.octx.moveTo(0, ch.oc.height / 2);
            ch.octx.lineTo(SPAN, ch.oc.height / 2);
            ch.octx.stroke();
            ch.prev = [null, null, null];
            ch.filled = 0;
        }

        function fitCharts() {
            var w = CH.acc.c.clientWidth || 900;
            CH.acc.c.width = w;
            CH.gyro.c.width = w;
            clearChart(CH.acc);
            clearChart(CH.gyro);
        }

        /* One sample = one pixel column: shift left, redraw the zero line, then
         * continue each axis from where it was. */
        function push(ch, values, full) {
            var oc = ch.oc, octx = ch.octx, h = oc.height;

            octx.drawImage(oc, -1, 0);
            octx.fillStyle = '#20202a';
            octx.fillRect(oc.width - 1, 0, 1, h);
            octx.fillStyle = '#3a3a3a';
            octx.fillRect(oc.width - 1, h / 2, 1, 1);

            for (var i = 0; i < 3; i++) {
                var v = values[i] / full;
                if (v > 1) { v = 1; } else if (v < -1) { v = -1; }
                var y = h / 2 - v * (h / 2 - 2);
                /* Shifting the image moves x, never y: the trace continues from the
                 * same height. Fill the span instead of stroking a 1 px line, so a
                 * one-pixel column stays crisp. */
                var y0 = ch.prev[i] === null ? y : ch.prev[i];
                var top = y < y0 ? y : y0;
                var bot = y < y0 ? y0 : y;
                octx.fillStyle = COLS[i];
                octx.fillRect(oc.width - 1, top, 1, (bot - top) < 1 ? 1 : (bot - top));
                ch.prev[i] = y;
            }

            if (ch.filled < oc.width) { ch.filled++; }
            ch.ctx.drawImage(oc, oc.width - ch.filled, 0, ch.filled, h,
                             0, 0, ch.c.width, ch.c.height);
        }

        function handle(d) {
            if (d.seq === lastSeq) { return; }   /* no new sample yet */
            lastSeq = d.seq;
            samples++;

            var accFs = ACC_FS[document.getElementById('accelSensitivity').value] || 2;
            var gyrFs = GYR_FS[document.getElementById('gyroSensitivity').value] || 250;
            push(CH.acc, d.acc, accFs);
            push(CH.gyro, d.gyro, gyrFs);

            document.getElementById('ax').textContent = d.acc[0].toFixed(2);
            document.getElementById('ay').textContent = d.acc[1].toFixed(2);
            document.getElementById('az').textContent = d.acc[2].toFixed(2);
            document.getElementById('gx').textContent = d.gyro[0].toFixed(1);
            document.getElementById('gy').textContent = d.gyro[1].toFixed(1);
            document.getElementById('gz').textContent = d.gyro[2].toFixed(1);
            document.getElementById('accRead').textContent = '±' + accFs + ' g';
            document.getElementById('gyrRead').textContent = '±' + gyrFs + ' dps';

            for (var i = 0; i < 3; i++) {
                document.getElementById('btn' + i).className = d.btn[i] ? 'led on' : 'led';
            }

            var txt = '<b>' + d.temp.toFixed(1) + '</b> &deg;C &middot; sample <b>' + d.seq +
                '</b> &middot; view <b>' + rate.toFixed(0) + '</b> /s';
            if (errors > 0) {
                txt += ' &middot; <span class="warn">' + errors + ' failed request(s)</span>';
            }
            statusEl.innerHTML = txt;
        }

        function tick() {
            if (!running) { return; }
            var started = performance.now();

            fetch('/getImu', { cache: 'no-store' })
                .then(function (r) { return r.json(); })
                .then(handle)
                .catch(function () { errors++; })
                .then(function () {
                    var now = performance.now();
                    if (now - lastRateTick >= 1000) {
                        rate = samples * 1000 / (now - lastRateTick);
                        samples = 0;
                        lastRateTick = now;
                    }
                    var wait = 1000 / parseInt(document.getElementById('fps').value, 10) - (now - started);
                    setTimeout(tick, wait > 0 ? wait : 0);
                });
        }

        document.getElementById('run').onclick = function () {
            running = !running;
            this.textContent = running ? 'Pause' : 'Run';
            this.className = running ? 'selected' : '';
            if (running) { tick(); }
        };
        window.addEventListener('resize', fitCharts);
        /* A hidden tab must stop polling: the device serves one client at a time. */
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                running = false;
                document.getElementById('run').textContent = 'Run';
                document.getElementById('run').className = '';
            }
        });

        function loadGyroSensitivity() {
            const loadingIndicator = document.getElementById('loadingIndicatorGyro');
            loadingIndicator.style.display = 'inline-flex';
            return new Promise((resolve, reject) => {
                var xhr = new XMLHttpRequest();
                xhr.open("GET", "/getGyroSensitivity", true);
                xhr.onload = function () {
                    if (xhr.status === 200) {
                        var select = document.getElementById('gyroSensitivity');
                        select.value = xhr.responseText.trim();
                        console.log("Gyro sensitivity loaded:", xhr.responseText);
                        loadingIndicator.style.display = 'none';
                        resolve();
                    } else {
                        console.error("Failed to load gyro sensitivity:", xhr.statusText);
                        loadingIndicator.style.display = 'none';
                        reject(new Error("Failed to load gyro sensitivity"));
                    }
                };
                xhr.onerror = () => {
                    loadingIndicator.style.display = 'none';
                    reject(new Error("Network request failed"));
                };
                xhr.send();
            });
        }
        function updateGyroSensitivity(newValue) {
            const loadingIndicator = document.getElementById('loadingIndicatorGyro');
            loadingIndicator.style.display = 'inline-flex';
            return new Promise((resolve, reject) => {
                var xhr = new XMLHttpRequest();
                xhr.open("POST", "/setGyroSensitivity", true);
                xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
                xhr.onload = function () {
                    if (xhr.status === 200) {
                        console.log("Gyro sensitivity updated to:", newValue);
                        loadingIndicator.style.display = 'none';
                        resolve();
                    } else {
                        console.error("Failed to update gyro sensitivity:", xhr.statusText);
                        loadingIndicator.style.display = 'none';
                        reject(new Error("Failed to update gyro sensitivity"));
                    }
                };
                xhr.onerror = () => {
                    loadingIndicator.style.display = 'none';
                    reject(new Error("Network request failed"));
                };
                xhr.send("gyro_sensitivity=" + newValue);
            });
        }
        function loadAccelSensitivity() {
            const loadingIndicator = document.getElementById('loadingIndicatorAccel');
            loadingIndicator.style.display = 'inline-flex';
            return new Promise((resolve, reject) => {
                var xhr = new XMLHttpRequest();
                xhr.open("GET", "/getAccelSensitivity", true);
                xhr.onload = function () {
                    if (xhr.status === 200) {
                        var select = document.getElementById('accelSensitivity');
                        select.value = xhr.responseText.trim();
                        console.log("Accel sensitivity loaded:", xhr.responseText);
                        loadingIndicator.style.display = 'none';
                        resolve();
                    } else {
                        console.error("Failed to load accel sensitivity:", xhr.statusText);
                        loadingIndicator.style.display = 'none';
                        reject(new Error("Failed to load accel sensitivity"));
                    }
                };
                xhr.onerror = () => {
                    loadingIndicator.style.display = 'none';
                    reject(new Error("Network request failed"));
                };
                xhr.send();
            });
        }
        function updateAccelSensitivity(newValue) {
            const loadingIndicator = document.getElementById('loadingIndicatorAccel');
            loadingIndicator.style.display = 'inline-flex';
            return new Promise((resolve, reject) => {
                var xhr = new XMLHttpRequest();
                xhr.open("POST", "/setAccelSensitivity", true);
                xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
                xhr.onload = function () {
                    if (xhr.status === 200) {
                        console.log("Accel sensitivity updated to:", newValue);
                        loadingIndicator.style.display = 'none';
                        resolve();
                    } else {
                        console.error("Failed to update accel sensitivity:", xhr.statusText);
                        loadingIndicator.style.display = 'none';
                        reject(new Error("Failed to update accel sensitivity"));
                    }
                };
                xhr.onerror = () => {
                    loadingIndicator.style.display = 'none';
                    reject(new Error("Network request failed"));
                };
                xhr.send("accel_sensitivity=" + newValue);
            });
        }
        function startIMUCalibration() {
            return new Promise((resolve, reject) => {
                var calibrateButton = document.getElementById('calibrateIMUButton');
                calibrateButton.classList.add('button-loading');
                calibrateButton.disabled = true;

                var xhr = new XMLHttpRequest();
                xhr.open("POST", "startIMUCalibration", true);
                xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");

                xhr.onload = function () {
                    calibrateButton.classList.remove('button-loading');
                    calibrateButton.disabled = false;

                    if (xhr.status === 200) {
                        console.log("IMU Calibration completed successfully");
                        alert("✓ IMU Calibration Successful!\n\nCalibration data has been saved to flash memory.");
                        resolve();
                    } else if (xhr.status === 408) {
                        console.error("IMU Calibration timeout");
                        alert("✗ IMU Calibration Timeout!\n\nPlease ensure the device is completely stationary during calibration.");
                        reject(new Error("Timeout"));
                    } else {
                        console.error("IMU Calibration failed:", xhr.statusText);
                        alert("✗ IMU Calibration Failed!\n\nError: " + xhr.responseText);
                        reject(new Error("Calibration failed"));
                    }
                };

                xhr.onerror = function () {
                    calibrateButton.classList.remove('button-loading');
                    calibrateButton.disabled = false;
                    alert("✗ Network Error!\n\nUnable to communicate with device.");
                    reject(new Error("Network request failed"));
                };

                xhr.send("IMU_CAL_START");
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            loadGyroSensitivity()
                .then(() => loadAccelSensitivity())
                .catch(e => console.error('IMU settings failed to load:', e));
        });

        fitCharts();
        lastRateTick = performance.now();
        tick();
    </script>
</body>

</html>
